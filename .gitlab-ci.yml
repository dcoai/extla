# Runs on the `DCOTek` runner (unprivileged, docker executor). ExTLA has no
# native NIFs and publishes no image.
#
# `check` builds and tests the Elixir side. `verify` runs the TLC differential
# corpus (test/differential/README.md), the Phase 1 acceptance gate
# (spec/08-decisions.md D-9): it re-runs TLC and fails if TLC no longer reports
# what the committed expected.json records, so those files are an oracle rather
# than a fixture somebody can edit to make a test pass.
#
# Comparing ExTLA's OWN answers to expected.json happens in the differential
# suite under `mix test` -- the `check` stage, not this one. An earlier version
# of this comment anticipated it as "one more job in this stage"; it arrived
# somewhere else, and a reader looking for it in `verify` would not find it
# (#73/#80).
#
# MERGE GATE (#70, #72). Two project settings are ON, recorded here because a setting nobody can
# see from a checkout is one that gets switched off without anyone noticing -- the same class of
# problem as the incident that produced it:
#
#   only_allow_merge_if_pipeline_succeeds = true
#   allow_merge_on_skipped_pipeline       = false
#
# The second matters as much as the first, and is the whole lesson of this milestone. Between #64
# and #71 this pipeline failed at `mix deps.get`, so `verify` never started and `mutation`,
# `tla-coverage-drift` and `tlc-corpus` reported **skipped**. FIVE merge requests landed on `main`
# that way. A skipped gate and a passing gate look identical in a merge request, and without the
# second setting GitLab would treat one as the other -- which is the same confusion between
# presence and evidence that TLA_COVERAGE.md exists to prevent one layer down.
#
# `only_allow_merge_if_all_discussions_are_resolved` is deliberately OFF. The defect was about
# pipeline status, not review threads; turning it on would add a blocking condition for a problem
# this project has not had. Revisit if review becomes multi-person.

stages:
  - check
  - verify

variables:
  # Pinned to the versions in .tool-versions, so CI and a developer's asdf
  # install cannot disagree about what "it compiles" means.
  ELIXIR_IMAGE: hexpm/elixir:1.20.4-erlang-29.0.5-debian-bookworm-20260824-slim

default:
  tags:
    - DCOTek
  interruptible: true

.elixir:
  image: $ELIXIR_IMAGE
  variables:
    MIX_ENV: test
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends git
    # The memory ceiling this job runs under (#85, #86). `main` #950 was OOM-killed --
    # `Killed  mix test`, which GitLab reports as `script_failure` and reads exactly like a
    # failing test -- and every measurement up to that point had been of the numerator only:
    # the suite peaks near 728 MB, against a limit nobody had recorded. Both paths because
    # cgroup v2 exposes the first and v1 the second; the `|| echo` matters as much as the
    # `cat`, since a silent absence would read as "unlimited" when it means "still unknown".
    - cat /sys/fs/cgroup/memory.max 2>/dev/null || cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null || echo "no cgroup limit visible"
    # That answer came back `max` -- no per-job ceiling at all -- which redirected the question
    # rather than settling it (#88). With no cgroup limit, `Killed mix test` is the HOST OOM
    # killer picking the largest process on a machine out of physical memory, so what matters is
    # what this host HAS and what else is on it. `free -m` reports the host's memory for the same
    # reason; `uptime` says whether other jobs were co-resident; `nproc` because ExUnit's
    # max_cases defaults to it and every peak-RSS figure in #77 and #85 was measured on 16 cores.
    # /proc rather than `free` and `uptime`: those come from `procps`, which this slim image
    # does not carry -- the first attempt at this line failed the job with `free: command not
    # found`. procfs is always there, and `|| true` so a diagnostic can never be what breaks a
    # build.
    - (head -3 /proc/meminfo; cat /proc/loadavg; nproc) 2>/dev/null || true
    # `surfex` is declared with a `git@host:` URL, which is what a developer needs: this
    # instance authenticates people by ssh key, and `mix deps.get` over https on a
    # workstation fails with `could not read Username`. But git has no built-in ssh -- an
    # scp-style URL makes git exec an `ssh` binary, which this slim image does not carry.
    # So CI maps that spelling onto the job-token URL, rather than `mix.exs` changing to
    # suit CI (#70, #71).
    #
    # The credential is `CI_JOB_TOKEN`: per-job and ephemeral, so nothing long-lived is
    # stored. It resolves only because `dco-tek/extla` is on `dco-tek/surfex`'s inbound
    # job-token allowlist, which is per-project and is NOT inherited from the group. If
    # this starts failing with "HTTP Basic: Access denied", check that allowlist before
    # touching anything here -- the message reads like a credential problem and is not one.
    #
    # `--add` on the second line is load-bearing. `insteadOf` is a multi-valued key and
    # plain `git config` REPLACES a value rather than appending, so without it the second
    # line silently deletes the first. Only the `git@` rewrite is needed today, since
    # `surfex` is the one git dependency -- the pair is taken as `extc` wrote it because
    # the hazard is invisible until a second git dependency is added, and then costs an
    # afternoon.
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/".insteadOf "https://${CI_SERVER_HOST}/"
    - git config --global --add url."https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/".insteadOf "git@${CI_SERVER_HOST}:"
    - mix local.hex --force
    - mix local.rebar --force
    - mix deps.get
  cache:
    key:
      files:
        - mix.lock
    paths:
      - deps
      - _build

format:
  extends: .elixir
  stage: check
  script:
    - mix format --check-formatted

compile:
  extends: .elixir
  stage: check
  script:
    # Warnings are errors here for the same reason they are locally: an unused
    # alias or an unreachable clause is usually a half-finished edit.
    - mix compile --force --warnings-as-errors
    # A lock entry outliving the dependency that pulled it in is the same kind of
    # half-finished edit, one file over. #69 removed dialyxir and left its
    # transitive `erlex` behind, where it sat until #117 -- inert, but nothing
    # asked. This runs in `compile` rather than in a job of its own because it is
    # a pure comparison of mix.lock against mix.exs: it needs neither fetched deps
    # nor compiled code, so its own job would spend a container start-up on a
    # sub-second string comparison.
    - mix deps.unlock --check-unused

test:
  extends: .elixir
  stage: check
  script:
    - mix test

# The library as a CONSUMER gets it, which is not how anything else here builds it.
#
# `stream_data` is `only: [:dev, :test]`, so under MIX_ENV=test the
# `Code.ensure_loaded?(StreamData)` gates are always true and their `else` branches are
# never compiled. A consumer does not get this project's dev/test dependencies, so for
# them the gates are false and those branches are the ones that build -- unexercised and,
# until this job, unlinted by the project that owns them.
#
# dco-tek/extla#51 is what that costs: an unused alias reached `extc`'s compile output,
# and ExTLA's own CI could not see it in any environment it built.
#
# MIX_ENV=prod because `mix.exs` gives it neither the dev nor the test dependencies, which
# is the closest this repo can get to standing where a consumer stands.
consumer-compile:
  extends: .elixir
  stage: check
  variables:
    MIX_ENV: prod
  script:
    # `before_script` already ran `mix deps.get`, and it ran it with MIX_ENV=prod, so what
    # is on disk is the dependency set a consumer would have.
    - mix compile --force --warnings-as-errors
    # Compiling those branches is not running them (#89, #90). The three `stream_data`
    # fallbacks exist ONLY in this environment, and their ArgumentError messages are the whole
    # consumer-facing experience of a missing optional dependency -- the function name, the dep
    # spec, the version. Until this script they had never been executed anywhere, so a typo in
    # any of them would have reached a consumer with nothing here to notice. Same defect class
    # as #84.
    - mix run --no-start bin/check-stream-data-fallbacks.exs

# What the gates catch (#46). The mutation harness copies the checker, breaks it on
# purpose, and reports which gate noticed — so it compiles the project several times over
# and cannot live in `test`, which #46 requires to stay near its current runtime.
#
# `timeout` (coreutils) is what makes a mutant that hangs an exit status rather than a
# stuck job, and the runner refuses to start without it rather than blocking for the
# job's whole limit.
mutation:
  extends: .elixir
  stage: verify
  script:
    # The runner's own behaviour first -- a broken runner would make every mutant look
    # like a survivor, so the sweep below is only meaningful if these pass.
    - mix test --only mutation
    # Then the measurement itself. Drift fails in both directions: a mutant that newly
    # survives is a regression in the gates, and one that newly dies is progress that has
    # to be recorded or it can be lost again with nothing noticing.
    #
    # ~8.5 minutes for 13 mutants, measured rather than estimated: each one compiles the
    # tree and runs a gate, and a killed mutant is fast while a surviving one pays for the
    # whole corpus. The timeout below is that measurement plus room, not a guess.
    - mix tla.mutants --check
  timeout: 40 minutes

# The oracle side of the corpus. This job is the reason expected.json can be
# trusted as a fixture: it is regenerated from TLC on every pipeline and diffed
# against what is committed, so a hand-edit that makes a future ExTLA test pass
# fails here instead.
# #1: the verification ledger. `TLA_COVERAGE.md` is generated, so a difference means it was
# hand-edited or a spec changed without a regenerate — both build failures. HARD from day one
# (#1, open question 2): "an advisory gate on a verification artifact is the same mistake as
# `IO.warn` on `max_states_reached`" (D-10).
#
# MIX_ENV=test because ExTLA's own specs ARE its test corpus; a consuming project's live in
# `lib/` and would use dev.
#
# What this does NOT fail on: items with NOTHING. The backlog is the document's content, not
# its error condition — a gate failing on gaps could only be satisfied by deleting rows.
#
# TWO THINGS CHECK THIS GOLDEN, and that is deliberate (#75, #84). `ledger_test.exs` asserts the
# same equality inside `mix test`, in the `check` stage, so a developer sees drift before pushing
# and CI fails one stage earlier than this job. That means **this job never runs on a drifted
# golden** — `check` has already failed — so a reader seeing `skipped` here beside a red `test`
# is looking at the system working, not at a gate that was missed.
#
# It is not redundant. The test exercises `TLA.Ledger.render/1`; this job is the only thing that
# runs the mix TASK — its argv parsing, `--check`, and `check!/2`. Deleting it would leave that
# task with no coverage at all. Its `Mix.raise` branches are covered by
# `test/mix/tla_coverage_test.exs` since #84; before that they had never executed anywhere.
tla-coverage-drift:
  extends: .elixir
  stage: verify
  variables:
    MIX_ENV: test
  script:
    - mix tla.coverage --check

# The only job that builds the documentation, and the only place the built-docs link gate can
# run (#102, #103).
#
# It cannot live in `test`: `ex_doc` is `only: :dev` and every other job sets MIX_ENV=test, so
# `mix docs` is not available to them. So the docs are built under dev and the gate — which reads
# `doc/*.html` and needs no ex_doc of its own — is run under test, in this one job.
#
# Without it the gate would be a local courtesy: `TLA.DocLinks.check/1` returns `:not_built` when
# nothing has been generated, and the test says so rather than passing. A check that never runs in
# CI is the shape #75 and #90 were raised about, and #102 is what it costs — ExDoc's sidebar home
# link 404'd on all 84 generated pages, invisible to every gate this project had, because a gate
# over source markdown cannot see a link the generator writes itself.
docs:
  extends: .elixir
  stage: verify
  script:
    - MIX_ENV=dev mix docs
    - mix test test/docs

tlc-corpus:
  stage: verify
  image: eclipse-temurin:21-jre
  variables:
    # Bumped together with TLA_TOOLS_VERSION in bin/tlc-expected; the key change
    # is what forces the new jar to be fetched rather than read from cache.
    TLA_TOOLS_VERSION: v1.7.4
  cache:
    key: tla2tools-$TLA_TOOLS_VERSION
    paths:
      - .tla
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends curl ca-certificates
  script:
    - bin/tlc-expected --check
