# Runs on the `DCOTek` runner (unprivileged, docker executor). ExTLA has no
# native NIFs and publishes no image, so `check` is the whole pipeline for now.
#
# A `verify` stage running the TLC differential corpus (test/differential/README.md)
# is the Phase 1 acceptance gate (spec/08-decisions.md D-9). It needs a JVM and
# tla2tools.jar, and lands with the first corpus entry -- an empty job that pulls
# a JDK to echo a message is not a gate.

stages:
  - check

variables:
  # Pinned to the versions in .tool-versions, so CI and a developer's asdf
  # install cannot disagree about what "it compiles" means.
  ELIXIR_IMAGE: hexpm/elixir:1.20.4-erlang-29.0.5-debian-bookworm-20260824-slim

default:
  tags:
    - DCOTek
  interruptible: true

.elixir:
  image: $ELIXIR_IMAGE
  variables:
    MIX_ENV: test
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends git
    - mix local.hex --force
    - mix local.rebar --force
    - mix deps.get
  cache:
    key:
      files:
        - mix.lock
    paths:
      - deps
      - _build

format:
  extends: .elixir
  stage: check
  script:
    - mix format --check-formatted

compile:
  extends: .elixir
  stage: check
  script:
    # Warnings are errors here for the same reason they are locally: an unused
    # alias or an unreachable clause is usually a half-finished edit.
    - mix compile --force --warnings-as-errors

test:
  extends: .elixir
  stage: check
  script:
    - mix test
