# Runs on the `DCOTek` runner (unprivileged, docker executor). ExTLA has no
# native NIFs and publishes no image.
#
# `check` builds and tests the Elixir side. `verify` runs the TLC differential
# corpus (test/differential/README.md), the Phase 1 acceptance gate
# (spec/08-decisions.md D-9): it re-runs TLC and fails if TLC no longer reports
# what the committed expected.json records, so those files are an oracle rather
# than a fixture somebody can edit to make a test pass.
#
# Comparing ExTLA's OWN answers to expected.json happens in the differential
# suite under `mix test` -- the `check` stage, not this one. An earlier version
# of this comment anticipated it as "one more job in this stage"; it arrived
# somewhere else, and a reader looking for it in `verify` would not find it
# (#73/#80).
#
# MERGE GATE (#70, #72). Two project settings are ON, recorded here because a setting nobody can
# see from a checkout is one that gets switched off without anyone noticing -- the same class of
# problem as the incident that produced it:
#
#   only_allow_merge_if_pipeline_succeeds = true
#   allow_merge_on_skipped_pipeline       = false
#
# The second matters as much as the first, and is the whole lesson of this milestone. Between #64
# and #71 this pipeline failed at `mix deps.get`, so `verify` never started and `mutation`,
# `surface-drift` (then named `tla-coverage-drift`) and `tlc-corpus` reported **skipped**. FIVE
# merge requests landed on `main` that way. A skipped gate and a passing gate look identical in a
# merge request, and without the second setting GitLab would treat one as the other -- which is
# the same confusion between presence and evidence that TLA_COVERAGE.md exists to prevent one
# layer down.
#
# `only_allow_merge_if_all_discussions_are_resolved` is deliberately OFF. The defect was about
# pipeline status, not review threads; turning it on would add a blocking condition for a problem
# this project has not had. Revisit if review becomes multi-person.
#
# WHAT THE MERGE GATE DOES NOT SAY (#122, #144). "Merges are gated" and "`main` is green" are
# different claims, and #72 only makes the first. The gate proves a branch was green WHEN IT WAS
# MERGED; it says nothing about `main` afterwards, and `main` goes red afterwards for reasons that
# live outside this repository -- pipeline #1083 (an unsigned Debian index) and #1171 (an Ubuntu
# mirror caught mid-sync) were both post-merge pipelines on `main`, both sat red for hours, and
# both were found by accident. Nothing watches the branch that merges land on.
#
# Two things now do, and one of them is a project setting, so it is recorded here for the same
# reason the merge-gate settings are:
#
#   pipeline schedule #2  "Is main green now?"   ref: main   cron: 0 5 * * * (UTC)   active
#
# A scheduled run answers "is `main` green NOW", which is a better question than "was it green
# when merged": it catches a break that arrived with no merge at all, and keeps reporting it
# until it is fixed. It runs every job below unchanged -- a job with no `rules:` runs on every
# pipeline source, and `changelog` diffs `origin/main...HEAD`, which on `main` is empty.
#
# The failed pipeline is the record, not the announcement. GitLab's own failed-pipeline email went
# out for #1083 and #1171 (both authored by the project owner at notification level
# `participating`) and reached nobody in a way they acted on, so the announcement is the second
# thing: `/session-startup` runs `~/Projects/claude-tools/main_verdict.exs` before triaging any
# issue, which reads the latest finished pipeline on `main`, prints the failed jobs with their
# log tails, and WARNS if this schedule is missing, inactive or overdue -- a detector that has
# gone quiet is indistinguishable from good news, and that is the confusion it exists to remove.
#
# Demonstrated firing on a genuinely red `main` in #144: the schedule was run once with
# ELIXIR_IMAGE overridden to a tag that does not exist, so every `check` job failed to pull its
# image and every `verify` gate behind them was skipped -- the #1083 shape exactly, a break from
# outside the repository with no merge involved -- and the verdict tool reported the red, named
# the jobs, and listed the gates that did not run. Then the variable was removed and the schedule
# run again green, so `main`'s last recorded verdict is not the demonstration.
#
# COMPILED DEPENDENCIES (#245, depdep v0.4.0). `scripts/depdep.exs --pull --mix-get
# --compile-deps` runs in `before_script` in place of `mix deps.get`: it restores compiled
# dependencies from the shared depdep store (the same objects bizex, extc, metresis and
# visualize restore), fetches only what the store lacked, and compiles exactly the misses;
# `compile` pushes what it built. Two settings outside this file make it work, recorded for the
# reason the merge-gate settings are (#247):
#
#   dco-tek/extla is on dco-tek/depdep's inbound job-token allowlist   (Mix.install fetches it)
#   DEPDEP_ENDPOINT / DEPDEP_BUCKET / DEPDEP_ACCESS_KEY / DEPDEP_SECRET_KEY   project CI variables
#
# Without the allowlist, `Mix.install` gets a 403 and the `|| mix deps.get` runs: a cold
# compile, not a red one (pipeline 2444 is the record). Without the variables, depdep announces
# that and exits 0. If `--pull` starts reporting "no DEPDEP_* variables" on a run that used to
# restore, the variables were removed, not the store.
#
# THE STORE IS THE ONLY SOURCE of compiled dependencies; there is no `mix.lock` cache (#251).
# There was one for a week. The first run with credentials (main, pipeline 2447, depdep v0.4.0)
# restored the hex tree and skipped `surfex` in both passes -- a leaf git dependency was never
# keyed (dco-tek/depdep#80, fixed by depdep#70 in v0.5.0) -- so the cache stayed to supply it.
# The v0.5.0 run (pipeline 2461) is the record that ended that: `compile` read `already present
# 7, skipped 0, not for this env 6`, and `test`, with nothing on disk, read `pulled 7, skipped
# 0` -- `surfex` from the store, the dev-only `ex_doc` tree correctly left alone. If a job
# ever compiles a dependency it should not have, the summary line says which and why; read it
# before reaching for a cache.
#
# A DEPDEP BUMP THAT CHANGES THE SCHEMA CAN COST ONE COLD PIPELINE. v0.7.0 (#329) keys objects
# on Mix's own converge and the full toolchain (depdep schema v3), so every object path moved,
# and depdep warns the first run refills the store. Here it did not: the bump's own pipeline
# read `pulled 6, missing 1` -- objects already under v3 keys for this toolchain -- and posted
# `saved ~10.3s`, the first saving extla ever reported. Objects pushed from v0.7.0 on carry
# their compile time, which is what `depdep.saved` and `depdep.compile_carried` report from.
# A long run right after such a bump is that refill, not a regression.
#
# Under v0.7.0 the one miss was `telemetry`: restored, then rebuilt because Mix called the
# build outdated, on every run, while `--push` read `already stored 7` and never replaced it.
# The object was fine. Its entries carried the pushing project's build path (metresis builds at
# `_build/sqlite/test`), so it unpacked where this project's Mix never looks (depdep#131, behind
# #110, where #329 added this evidence). v0.9.0 (#346) moves each restored tree to this
# project's own build path, and the pin's own pipeline (4000, at 43e92bb7) read
# `pulled 7, missing 0` with no `rebuilt` in compile, test and surface-drift: every dependency
# restored and nothing compiled. A `rebuilt N` on the summary line now means a refusal worth
# reading; `--explain-rebuilt` prints why Mix refused it.
#
# v0.10.0 (#363, for #349) fixes the second cause of a refused restore. A git dependency's
# stored object kept the pusher's `origin`, and Mix compares the lock's URL with it as a
# string, so `git@…` against `https://…` read as out of date. The address is now corrected on
# restore. Keys and schema are unchanged, so nothing in the store is refilled. extla has no git
# dependency of its own; the fix matters to peers that restore extla, whose objects exist in
# the store under both spellings.

stages:
  - check
  - verify

variables:
  # Pinned to the versions in .tool-versions, so CI and a developer's asdf
  # install cannot disagree about what "it compiles" means.
  ELIXIR_IMAGE: hexpm/elixir:1.20.4-erlang-29.0.5-debian-bookworm-20260824-slim

default:
  tags:
    - DCOTek
  interruptible: true

.elixir:
  image: $ELIXIR_IMAGE
  variables:
    MIX_ENV: test
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends git
    # The memory ceiling this job runs under (#85, #86). `main` #950 was OOM-killed --
    # `Killed  mix test`, which GitLab reports as `script_failure` and reads exactly like a
    # failing test -- and every measurement up to that point had been of the numerator only:
    # the suite peaks near 728 MB, against a limit nobody had recorded. Both paths because
    # cgroup v2 exposes the first and v1 the second; the `|| echo` matters as much as the
    # `cat`, since a silent absence would read as "unlimited" when it means "still unknown".
    - cat /sys/fs/cgroup/memory.max 2>/dev/null || cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null || echo "no cgroup limit visible"
    # That answer came back `max` -- no per-job ceiling at all -- which redirected the question
    # rather than settling it (#88). With no cgroup limit, `Killed mix test` is the HOST OOM
    # killer picking the largest process on a machine out of physical memory, so what matters is
    # what this host HAS and what else is on it. `free -m` reports the host's memory for the same
    # reason; `uptime` says whether other jobs were co-resident; `nproc` because ExUnit's
    # max_cases defaults to it and every peak-RSS figure in #77 and #85 was measured on 16 cores.
    # /proc rather than `free` and `uptime`: those come from `procps`, which this slim image
    # does not carry -- the first attempt at this line failed the job with `free: command not
    # found`. procfs is always there, and `|| true` so a diagnostic can never be what breaks a
    # build.
    - (head -3 /proc/meminfo; cat /proc/loadavg; nproc) 2>/dev/null || true
    # No `git config insteadOf` here any more (#333). It mapped `surfex`'s `git@host:` URL
    # onto a `CI_JOB_TOKEN` URL (#70, #71), and surfex was the only git dependency; it now
    # comes from Hex. A git dependency added later brings that back -- commit 7e16bd3 (#71)
    # has the pair of lines and why the second needs `--add`, plus the per-project job-token
    # allowlist it depends on. depdep's own fetch builds its token URL in
    # scripts/depdep.exs and never relied on the rewrite.
    - mix local.hex --force
    - mix local.rebar --force
    # One line does three things, in an order that matters (#245, depdep v0.4.0): restore
    # compiled dependencies from the shared depdep store, run `mix deps.get` to fetch only
    # what the store did not have, then decide again over the units the first pass could
    # not key -- a git dependency's lock entry records no dependency list, so nothing above
    # it can be keyed until the source is on disk. No dependency is git since #333 (surfex
    # was the one), so today that second pass finds nothing left; it stays because it is
    # what keeps a future git dependency restorable. Restoring BEFORE
    # fetching is load-bearing: source fetched first carries fresh mtimes and Mix rebuilds
    # everything the store just restored. `--compile-deps` compiles exactly the misses, so
    # the `mix compile` in each job finds every dependency up to date.
    #
    # `|| mix deps.get` is for the day depdep itself cannot start (its repository unreachable
    # for `Mix.install`): the job goes cold, not red. With no DEPDEP_* variables depdep says
    # so, still runs `deps.get`, and exits 0. A `deps.get` that fails inside depdep fails
    # again outside with the same error, as the bare line always did; a dependency that
    # does not compile ends the run with Mix's status -- this project's own compile,
    # surfaced one line earlier (see scripts/depdep.exs).
    - elixir scripts/depdep.exs --pull --mix-get --compile-deps || mix deps.get
  # No `cache:` here, deliberately (#251). Compiled dependencies come from the depdep store
  # and from nowhere else: a content-addressed store restores only a build these inputs would
  # produce, where the `mix.lock`-keyed `deps`/`_build` cache this once had was a second source
  # of truth beside it -- wholesale, per-runner, and silently wrong across a version bump. The
  # header records the run that showed the store carrying everything. What stays cached is
  # `tlc-corpus`'s tla2tools jar: a checksum-verified download, not a compiled dependency.

format:
  extends: .elixir
  stage: check
  script:
    - mix format --check-formatted

changelog:
  extends: .elixir
  stage: check
  variables:
    # The guard diffs against the MERGE BASE, which a shallow clone does not have. Without
    # this the `git diff` fails rather than returning nothing -- the script halts 2 and says
    # so, deliberately, because an empty result would read as "no lib/ change" and pass. A
    # gate that reports success when it could not run is the defect #70 cost five merges to
    # learn (#122 is the same shape through a third door).
    GIT_DEPTH: 0
  script:
    # #124: four of the eight most recent merges touching lib/ carried no CHANGELOG entry,
    # including two that shipped new public API. Investigating for #142 found there had never
    # been a rule to break -- the eighteen-work-item run that looked like one was the
    # documentation milestones, fourteen of which touched no lib/ at all -- so this
    # establishes the rule rather than restoring it.
    #
    # `Changelog-none: <reason>` in a commit message is the way to answer rather than obey.
    # The reason is required and lands in the history beside the diff, which is the property
    # that separates an escape hatch from a bypass.
    - elixir bin/changelog_guard.exs

compile:
  extends: .elixir
  stage: check
  script:
    # Warnings are errors here for the same reason they are locally: an unused
    # alias or an unreachable clause is usually a half-finished edit.
    - mix compile --force --warnings-as-errors
    # Store what this build compiled that the depdep store lacked (#245). After the build,
    # so a failed compile never populates the store; only the misses are uploaded, so a
    # converged store sends nothing. This job compiles under MIX_ENV=test, which is what
    # every other job restores.
    - elixir scripts/depdep.exs --push || echo "depdep push unavailable - nothing pushed"
    # A lock entry outliving the dependency that pulled it in is the same kind of
    # half-finished edit, one file over. #69 removed dialyxir and left its
    # transitive `erlex` behind, where it sat until #117 -- inert, but nothing
    # asked. This runs in `compile` rather than in a job of its own because it is
    # a pure comparison of mix.lock against mix.exs: it needs neither fetched deps
    # nor compiled code, so its own job would spend a container start-up on a
    # sub-second string comparison.
    - mix deps.unlock --check-unused

test:
  extends: .elixir
  stage: check
  variables:
    # `mix test` reads this repository's own history, so it cannot run on a shallow clone
    # (#147). `test/ex_tla/changelog_guard_test.exs` pins eight real merges and asserts what the
    # guard says about each -- #142 chose real merges over fixtures deliberately, so that the
    # regression cannot agree with itself -- and the oldest reaches back 39 commits.
    #
    # The depth is a PROJECT SETTING and is invisible from a checkout, which is why it is
    # recorded here beside the merge-gate settings:
    #
    #   ci_default_git_depth = 20
    #
    # That is generations of the commit graph, not commits, so with a merge per work item the
    # horizon lands near 38 -- and the pinned shas sat at 17 through 39. The oldest was ONE
    # commit inside it. Pipeline #254 is what that cost: a release commit added one commit,
    # `01e1604^1` fell off the end, and a green suite went red on a merge that had not
    # changed. Any merge would have done it; the next would have taken the one after that.
    GIT_DEPTH: 0
  script:
    - mix test
    # The relation log's evidence from this job's run (#336, #351), under the job's own name
    # so `relation-evidence` downloads all three side by side. A retry replaces its own file.
    - mkdir -p surfex-evidence && cp _build/surfex/evidence.jsonl surfex-evidence/test.jsonl
  artifacts:
    paths:
      - surfex-evidence/
    expire_in: 1 week

# The library as a CONSUMER gets it, which is not how anything else here builds it.
#
# `stream_data` is `only: [:dev, :test]`, so under MIX_ENV=test the
# `Code.ensure_loaded?(StreamData)` gates are always true and their `else` branches are
# never compiled. A consumer does not get this project's dev/test dependencies, so for
# them the gates are false and those branches are the ones that build -- unexercised and,
# until this job, unlinted by the project that owns them.
#
# dco-tek/extla#51 is what that costs: an unused alias reached `extc`'s compile output,
# and ExTLA's own CI could not see it in any environment it built.
#
# MIX_ENV=prod because `mix.exs` gives it neither the dev nor the test dependencies, which
# is the closest this repo can get to standing where a consumer stands.
consumer-compile:
  extends: .elixir
  stage: check
  variables:
    MIX_ENV: prod
  script:
    # `before_script` already ran `mix deps.get`, and it ran it with MIX_ENV=prod, so what
    # is on disk is the dependency set a consumer would have.
    - mix compile --force --warnings-as-errors
    # Compiling those branches is not running them (#89, #90). The three `stream_data`
    # fallbacks exist ONLY in this environment, and their ArgumentError messages are the whole
    # consumer-facing experience of a missing optional dependency -- the function name, the dep
    # spec, the version. Until this script they had never been executed anywhere, so a typo in
    # any of them would have reached a consumer with nothing here to notice. Same defect class
    # as #84.
    - mix run --no-start bin/check-stream-data-fallbacks.exs

# What the gates catch (#46). The mutation harness copies the checker, breaks it on
# purpose, and reports which gate noticed — so it compiles the project several times over
# and cannot live in `test`, which #46 requires to stay near its current runtime.
#
# `timeout` (coreutils) is what makes a mutant that hangs an exit status rather than a
# stuck job, and the runner refuses to start without it rather than blocking for the
# job's whole limit.
mutation:
  extends: .elixir
  stage: verify
  # Its archive is its own evidence only. By default a verify job downloads `test`'s artifacts,
  # and they would ride along into this archive as a stale second `test.jsonl` (#351).
  dependencies: []
  script:
    # The runner's own behaviour first -- a broken runner would make every mutant look
    # like a survivor, so the sweep below is only meaningful if these pass.
    - mix test --only mutation
    # The relation log's evidence from this job's run (#336, #351), under the job's own name
    # so `relation-evidence` downloads all three side by side. A retry replaces its own file.
    - mkdir -p surfex-evidence && cp _build/surfex/evidence.jsonl surfex-evidence/mutation.jsonl
    # Then the measurement itself. Drift fails in both directions: a mutant that newly
    # survives is a regression in the gates, and one that newly dies is progress that has
    # to be recorded or it can be lost again with nothing noticing.
    #
    # ~8.5 minutes for 13 mutants, measured rather than estimated: each one compiles the
    # tree and runs a gate, and a killed mutant is fast while a surviving one pays for the
    # whole corpus. The timeout below is that measurement plus room, not a guess.
    - mix extla.mutants --check
  timeout: 40 minutes
  artifacts:
    paths:
      - surfex-evidence/
    expire_in: 1 week

# The oracle side of the corpus. This job is the reason expected.json can be
# trusted as a fixture: it is regenerated from TLC on every pipeline and diffed
# against what is committed, so a hand-edit that makes a future ExTLA test pass
# fails here instead.
# #1: the verification ledger. `TLA_COVERAGE.md` is generated, so a difference means it was
# hand-edited or a spec changed without a regenerate — both build failures. HARD from day one
# (#1, open question 2): "an advisory gate on a verification artifact is the same mistake as
# `IO.warn` on `max_states_reached`" (D-10).
#
# MIX_ENV=test because ExTLA's own specs ARE its test corpus; a consuming project's live in
# `lib/` and would use dev.
#
# What this does NOT fail on: items with NOTHING. The backlog is the document's content, not
# its error condition — a gate failing on gaps could only be satisfied by deleting rows.
#
# TWO THINGS CHECK THIS GOLDEN, and that is deliberate (#75, #84). `ledger_test.exs` asserts the
# same equality inside `mix test`, in the `check` stage, so a developer sees drift before pushing
# and CI fails one stage earlier than this job. That means **this job never runs on a drifted
# golden** — `check` has already failed — so a reader seeing `skipped` here beside a red `test`
# is looking at the system working, not at a gate that was missed.
#
# It is not redundant. The test exercises `ExTLA.Ledger.render/1`; this job is the only thing that
# runs the mix TASK — its argv parsing, `--check`, and `check!/2`. Deleting it would leave that
# task with no coverage at all. Its `Mix.raise` branches are covered by
# `test/mix/extla_coverage_test.exs` since #84; before that they had never executed anywhere.
#
# ONE JOB FOR EVERY SURFACE GOLDEN (#270). `tla-coverage-drift` was this job's name while the
# ledger was the only golden; `API_SURFACE.md` (#271) joined it, and the goldens #270 still
# owes join it here rather than each minting a job — a golden's header names `surface-drift`
# as its gate, and that name has to be one job or the header is a claim about nothing.
surface-drift:
  extends: .elixir
  stage: verify
  variables:
    MIX_ENV: test
  script:
    - mix extla.coverage --check
    - mix extla.api_surface --check
    - mix extla.cli_surface --check
    - mix extla.diagnostics --check
    - mix extla.package_surface --check
    # The one that runs the other way: `spec/07-examples.md` is the SOURCE and the corpus
    # entries are the artifact (#280). Same guarantee, same job — a golden's header names
    # `surface-drift` as its gate, and that name has to be one job.
    - mix extla.examples --check

# The only job that builds the documentation, and the only place the built-docs link gate can
# run (#102, #103).
#
# It cannot live in `test`: `ex_doc` is `only: :dev` and every other job sets MIX_ENV=test, so
# `mix docs` is not available to them. So the docs are built under dev and the gate — which reads
# `doc/*.html` and needs no ex_doc of its own — is run under test, in this one job.
#
# Without it the gate would be a local courtesy: `ExTLA.DocLinks.check/1` returns `:not_built` when
# nothing has been generated, and the test says so rather than passing. A check that never runs in
# CI is the shape #75 and #90 were raised about, and #102 is what it costs — ExDoc's sidebar home
# link 404'd on all 84 generated pages, invisible to every gate this project had, because a gate
# over source markdown cannot see a link the generator writes itself.
docs:
  extends: .elixir
  stage: verify
  # Its archive is its own evidence only. By default a verify job downloads `test`'s artifacts,
  # and they would ride along into this archive as a stale second `test.jsonl` (#351).
  dependencies: []
  script:
    # `--warnings-as-errors` since #291. The build emitted 34 unresolved references and
    # exited 0, and `ExTLA.DocLinks` cannot see them: it scans `@href` in the built HTML, and
    # an unresolvable reference emits NO href — it renders as plain inline code. A gate that
    # cannot see the surface the defect lives on, which is #102's shape one door over.
    - MIX_ENV=dev mix docs --warnings-as-errors
    - mix test test/docs --include needs_built_docs
    # The relation log's evidence from this job's run (#336, #351), under the job's own name
    # so `relation-evidence` downloads all three side by side. A retry replaces its own file.
    - mkdir -p surfex-evidence && cp _build/surfex/evidence.jsonl surfex-evidence/docs.jsonl
  artifacts:
    paths:
      - surfex-evidence/
    expire_in: 1 week

# spec/04's relation log, checked against the evidence of every job that runs tests (#336).
# Each of `test`, `mutation` and `docs` runs a different slice of the suite and records the
# rest as excluded, so no one file can validate every relation. `--merge` reads the three
# together, and a claim no job ran stays unchecked rather than passing.
#
# NOT YET A GATE (#351): no relation is recorded until spec/04 is tagged (#352, #353) and
# baselined (#354), so a pass here would be vacuous. #354 removes `allow_failure`.
relation-evidence:
  extends: .elixir
  stage: verify
  needs: [test, mutation, docs]
  allow_failure: true
  script:
    - mix compile
    - >-
      mix surfex.status --evidence
      --merge surfex-evidence/test.jsonl
      --merge surfex-evidence/mutation.jsonl
      --merge surfex-evidence/docs.jsonl

tlc-corpus:
  stage: verify
  image: eclipse-temurin:21-jre
  variables:
    # Bumped together with TLA_TOOLS_VERSION in bin/tlc-expected; the key change
    # is what forces the new jar to be fetched rather than read from cache.
    TLA_TOOLS_VERSION: v1.7.4
  cache:
    key: tla2tools-$TLA_TOOLS_VERSION
    paths:
      - .tla
  # No `before_script`, and the absence is the fix (#122, #143).
  #
  # This job used to `apt-get update && apt-get install curl ca-certificates`. Measured against
  # the image it actually runs, both were already there:
  #
  #     $ docker run --rm eclipse-temurin:21-jre which curl wget
  #     /usr/bin/curl
  #     /usr/bin/wget
  #
  # and a real HTTPS fetch of tla2tools.jar succeeds in the bare image, checksum and all, so
  # `ca-certificates` was present too. The install downloaded nothing and changed nothing --
  # it existed only to reach a public archive.
  #
  # That archive is what failed in pipeline #1171: `apt-get update` got a Packages.gz one byte
  # short of what the Release file declared, and `tlc-corpus` went red on `main` for hours. The
  # job was taking an unnecessary dependency on the outside world before doing any work, and it
  # is the only thing that ever broke here.
  #
  # `bin/tlc-expected` reaches for `curl` only on a cache MISS -- `ensure_jar` returns early when
  # the jar is present and checksums -- so on the overwhelming majority of runs nothing is
  # fetched at all. If a future base image drops curl, the miss path fails loudly with
  # `curl: not found`, which is the right way round: a missing tool should stop the job, not
  # quietly reintroduce an archive round-trip on every pipeline.
  script:
    - bin/tlc-expected --check

# The image every Elixir job will run in (#309, #364): `$ELIXIR_IMAGE` plus `git`, Hex and
# Rebar, which each job used to fetch over the network before running a line of project code.
# Built only when `ci/base.Dockerfile` changes or when run by hand, so the archive is reached
# once per image rather than once per job. Its tag is a hash of its inputs (the Dockerfile and
# `ELIXIR_IMAGE`), as exio's tool image does, so it builds nothing when the registry already
# has it. It prints the pushed DIGEST, which is what `.elixir` pins (#365), because a tag can
# be pushed over and a digest cannot.
ci-base-image:
  stage: check
  needs: []
  tags:
    - dind
  image: docker:28-cli
  services:
    - docker:28-dind
  interruptible: false
  # Branch pushes only, never merge-request events. A `changes:` rule with no source condition
  # also matches an MR event, which made GitLab open a second, MR pipeline holding only this
  # job. That pipeline then stood as the MR's head pipeline, green on this job alone, and it
  # raced the branch pipeline's build of the same tag (#364).
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - ci/base.Dockerfile
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_BUILDKIT: "1"
  before_script:
    - for i in $(seq 1 60); do docker info >/dev/null 2>&1 && break; sleep 1; done
    - docker info >/dev/null
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      tag=$( { echo "$ELIXIR_IMAGE"; cat ci/base.Dockerfile; } | sha256sum | cut -c1-16 )
      image="$CI_REGISTRY_IMAGE/ci-base:$tag"
      if docker manifest inspect "$image" >/dev/null 2>&1; then
        echo "$image is already in the registry"
        docker pull -q "$image" >/dev/null
      else
        docker build -f ci/base.Dockerfile --build-arg ELIXIR_IMAGE="$ELIXIR_IMAGE" -t "$image" .
        docker push "$image"
      fi
      digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
      echo "CI base image: $digest"
      echo "$digest" > ci-base-image.txt
  artifacts:
    paths:
      - ci-base-image.txt
    expire_in: 30 days
